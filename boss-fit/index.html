<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>상사궁합 결산 2026</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 한 장짜리 결재 서류. 질문은 서류 한 칸씩, 결과는 '회사생활 명세서' + 결재 도장 */
:root{
  --paper:#F6F7F9; --sheet:#FFFFFF; --ink:#1E2740; --muted:#626B82; --line:#D9DDE6;
  --stamp:#D23A2E; --marker:#FFE14D; --marker-ink:#1E2740; --soft:#EEF1F6;
  --display:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121725; --sheet:#1B2234; --ink:#E9ECF3; --muted:#9BA3B8; --line:#2E3750;
  --stamp:#F0675B; --marker:#F5D63D; --marker-ink:#1E2740; --soft:#232B40; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121725; --sheet:#1B2234; --ink:#E9ECF3; --muted:#9BA3B8; --line:#2E3750;
  --stamp:#F0675B; --marker:#F5D63D; --marker-ink:#1E2740; --soft:#232B40; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65;word-break:keep-all;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--stamp);outline-offset:2px}
.mark{background:linear-gradient(transparent 55%,var(--marker) 55%);color:inherit;padding:0 2px}
.label{font-size:12px;font-weight:700;letter-spacing:.02em;color:var(--muted)}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:22px 20px}

/* intro */
.doc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.docno{font-family:var(--mono);font-size:12px;color:var(--muted);line-height:1.5}
.approval{display:grid;grid-template-columns:repeat(3,44px);border:1px solid var(--ink);flex-shrink:0}
.approval div{border-left:1px solid var(--ink);text-align:center;font-size:12px}
.approval div:first-child{border-left:0}
.approval span{display:block;border-bottom:1px solid var(--ink);padding:2px 0;background:var(--soft)}
.approval i{display:grid;place-items:center;height:36px;font-style:normal}
.seal{width:30px;height:30px;border:2px solid var(--stamp);border-radius:50%;color:var(--stamp);font-family:var(--display);font-size:12px;display:grid;place-items:center;transform:rotate(-12deg)}
.hero-title{font-size:38px;line-height:1.15;margin-top:18px}
.hero-sub{color:var(--muted);margin-top:10px}
.cast{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:20px}
.cast figure{margin:0;text-align:center;font-size:13px;line-height:1.4;color:var(--muted)}
.cast figcaption b{display:block;color:var(--ink);font-size:15px}
.legend{margin-top:14px;padding:12px 14px;background:var(--soft);border-radius:6px;font-size:14px;line-height:1.6}
.cast svg{width:100%;max-width:72px;height:auto;display:block;margin:0 auto 4px}
.meta-row{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-top:16px}
.btn{display:block;width:100%;border:0;border-radius:6px;padding:16px;font-size:17px;font-weight:700;background:var(--ink);color:var(--sheet);text-align:center}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.stamp{background:var(--stamp);color:#fff}
.fine{font-size:13px;color:var(--muted);text-align:center}

/* quiz */
.progress{display:flex;align-items:center;gap:10px}
.bar{flex:1;height:6px;background:var(--soft);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);transition:width .25s}
.count{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.back{background:none;border:0;padding:6px 0;color:var(--muted);font-size:14px}
.section-tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:3px;background:var(--soft);color:var(--muted)}
.section-tag.boss{background:var(--stamp);color:#fff}
.q{font-size:26px;line-height:1.35;margin-top:12px}
.hint{font-size:15px;color:var(--stamp);font-weight:700}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:16px;font-size:17px;line-height:1.45;min-height:60px}
.opt b{font-family:var(--mono);font-size:13px;color:var(--muted);padding-top:2px}
.opt:hover{border-color:var(--ink)}
.opt.picked{border-color:var(--ink);background:var(--soft)}

/* loading */
.loading{text-align:center;padding:60px 0}
.loading .seal{width:72px;height:72px;font-size:22px;margin:0 auto 18px;animation:thump .9s ease-in-out infinite}
@keyframes thump{0%,100%{transform:rotate(-12deg) scale(1)}50%{transform:rotate(-12deg) scale(.86)}}

/* result */
.res-top{display:flex;gap:14px;align-items:center}
.res-top svg{width:92px;height:auto;flex-shrink:0}
.res-type{font-size:14px;font-weight:700;color:var(--stamp)}
.res-name{font-size:30px;line-height:1.15;margin-top:2px}
.res-line{margin-top:6px;font-size:16px}
.summary{text-align:center;display:flex;flex-direction:column;gap:4px}
.summary h1{font-size:28px;line-height:1.3}
.summary p{color:var(--muted);font-size:15px}
.typedef{margin-top:14px;font-size:14px;color:var(--muted)}
.desc{margin-top:16px;font-size:16px;color:var(--ink)}
.slip{margin-top:6px;border-top:2px solid var(--ink)}
.slip-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:15px}
.slip-cap{margin-top:18px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.slip-cap span{font-size:12px;color:var(--muted)}
.slip-row span:last-child{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.slip-row.total{border-bottom:2px solid var(--ink);font-weight:700;flex-direction:column;gap:2px}
.slip-row.total span:last-child{text-align:left;white-space:normal;color:var(--stamp)}
.match{position:relative;margin-top:4px}
.match-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.score{font-family:var(--mono);font-size:52px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:18px;color:var(--muted)}
.duo{display:flex;align-items:center;gap:6px}
.duo svg{width:48px;height:auto}
.duo em{font-style:normal;font-family:var(--display);font-size:18px;color:var(--stamp)}
.gauge{height:10px;background:var(--soft);border-radius:5px;overflow:hidden;margin-top:12px}
.gauge i{display:block;height:100%;background:var(--stamp)}
.verdict{margin-top:14px;font-size:16px;font-weight:500}
.big-stamp{position:absolute;right:-4px;top:-14px;border:3px solid var(--stamp);color:var(--stamp);font-family:var(--display);font-size:18px;padding:4px 10px;border-radius:6px;transform:rotate(9deg);opacity:.9;background:transparent}
.locked{position:relative;overflow:hidden}
.locked ol{margin:12px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:16px}
.locked .blur{filter:blur(5px);user-select:none;color:var(--muted);margin-top:12px;font-size:14px}
.price{display:flex;align-items:baseline;gap:8px;margin-top:16px}
.price b{font-family:var(--mono);font-size:26px}
.price s{color:var(--muted);font-size:14px}
.fake{margin-top:14px;padding:16px;border:1px dashed var(--stamp);border-radius:6px;display:flex;flex-direction:column;gap:10px}
.fake input{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:6px;background:var(--sheet);color:var(--ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--sheet);padding:10px 16px;border-radius:6px;font-size:14px;z-index:20}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap" id="app"></div>
<div class="toast" id="toast" hidden></div>

<script>
// ── 캐릭터 (자체 제작: 사무용품 4종) ──
const FACE = (x,y,c)=>`<circle cx="${x-9}" cy="${y}" r="3.2" fill="${c}"/><circle cx="${x+9}" cy="${y}" r="3.2" fill="${c}"/>`;
const CHAR = {
  TB:`<svg viewBox="0 0 120 120" aria-hidden="true"><rect x="14" y="70" width="92" height="22" rx="8" fill="#3A4A7A"/><path d="M18 70 Q20 44 60 42 L100 46 Q106 48 104 60 L102 70 Z" fill="#5468A8"/><rect x="92" y="60" width="14" height="10" rx="3" fill="#C9CFDD"/>${FACE(52,58,'#fff')}<path d="M45 66 h14" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M68 34 l6 -10 M78 38 l10 -8" stroke="#D23A2E" stroke-width="3" stroke-linecap="round"/></svg>`,
  TG:`<svg viewBox="0 0 120 120" aria-hidden="true"><path d="M48 22 q-6 -8 0 -14 M62 24 q-6 -8 0 -14" stroke="#9BA3B8" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M84 52 h8 a14 14 0 0 1 0 28 h-8" stroke="#E8A33A" stroke-width="7" fill="none"/><rect x="26" y="36" width="60" height="62" rx="10" fill="#F2B544"/><rect x="26" y="36" width="60" height="10" rx="5" fill="#D9962C"/><path d="M40 64 q5 -4 10 0 M62 64 q5 -4 10 0" stroke="#1E2740" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M50 78 q6 5 12 0" stroke="#1E2740" stroke-width="3" fill="none" stroke-linecap="round"/></svg>`,
  MB:`<svg viewBox="0 0 120 120" aria-hidden="true"><path d="M20 22 h80 v58 l-20 20 h-60 z" fill="#FFE14D"/><path d="M100 80 l-20 20 v-20 z" fill="#E5C42F"/>${FACE(60,54,'#1E2740')}<path d="M50 66 q10 10 20 0" stroke="#1E2740" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M96 14 l6 -6 M104 22 l8 -2 M88 10 l0 -6" stroke="#D23A2E" stroke-width="3" stroke-linecap="round"/></svg>`,
  MG:`<svg viewBox="0 0 120 120" aria-hidden="true"><path d="M60 54 q-26 -6 -30 -30 q24 2 30 30 M60 54 q24 -10 34 -32 q-26 0 -34 32" fill="#4FA36A"/><path d="M60 58 v-10" stroke="#3B8454" stroke-width="4"/><path d="M30 58 h60 l-8 44 h-44 z" fill="#C8734A"/><rect x="26" y="54" width="68" height="10" rx="3" fill="#B0603A"/><path d="M44 80 h8 M68 80 h8" stroke="#1E2740" stroke-width="3" stroke-linecap="round"/><path d="M56 90 h8" stroke="#1E2740" stroke-width="3" stroke-linecap="round"/></svg>`
};

// ── 유형 ──
const TYPES = {
  TB:{code:'똑부',def:'계획파 + 부지런',name:'철컥이',obj:'스테이플러',line:'일은 찍으면 끝난다',
      desc:'일정과 결론이 머릿속에 이미 서 있는 사람. 남들이 회의록을 열 때 당신은 액션 아이템을 보내고 있어요. 문제는 다들 당신에게만 일을 몰아준다는 것.',
      slip:[['올해 대신 정리한 회의록','47건'],['"이거 누가 했어?" 들은 횟수','셀 수 없음'],['남은 연차','9.5일']],total:['2027 한 줄 조언','일을 덜 받는 연습. 거절도 실력이에요.']},
  TG:{code:'똑게',def:'계획파 + 느긋',name:'느긋컵',obj:'머그컵',line:'할 건 하고, 식기 전에 마신다',
      desc:'일을 덜 하는 게 아니라 덜 하게 만드는 사람. 반복 업무는 이미 자동화했고, 퇴근 10분 전엔 책상이 깨끗해요. 단, 바빠 보이지 않아서 오해를 받기도.',
      slip:[['만든 엑셀 함수','23개'],['그 덕에 줄인 야근','약 60시간'],['남은 연차','0일 (계획대로)']],total:['2027 한 줄 조언','가끔은 진행 상황을 먼저 공유해 주세요.']},
  MB:{code:'멍부',def:'직진파 + 부지런',name:'붙임이',obj:'포스트잇',line:'일단 붙고 본다',
      desc:'누구보다 먼저 손을 들고, 누구보다 늦게 퇴근하는 열정 담당. 방향이 살짝 틀릴 때도 있지만 팀에서 제일 믿음직한 엔진이에요. 내년엔 질문 하나 더 하기.',
      slip:[['자발적으로 맡은 일','31건'],['"제가 할게요" 말한 횟수','주 4.2회'],['남은 연차','12일']],total:['2027 한 줄 조언','시작하기 전에 질문 하나만 먼저.']},
  MG:{code:'멍게',def:'직진파 + 느긋',name:'광합이',obj:'사무실 화분',line:'존재만으로 공기를 맑게',
      desc:'급할 것 없는 평화주의자. 마감 전날 몰아치는 집중력은 아무도 못 따라가요. 팀이 날 서 있을 때 분위기를 풀어주는 건 늘 당신입니다.',
      slip:[['평화롭게 넘긴 회의','86회'],['마감 전날 각성','매달 1회'],['남은 연차','기억 안 남']],total:['2027 한 줄 조언','마감 알람을 하루 일찍 맞춰 두세요.']}
};

// ── 궁합 [나][상사] ──
const MATCH = {
  TB:{TB:[82,'회의가 15분 만에 끝나는 사이. 둘 다 쉬지 않아서 팀원들이 숨 막혀 할 수 있어요.'],
      TG:[95,'올해 최고의 조합. 상사는 방향만, 당신은 실행. 올해 성과는 당신 이름으로 남아요.'],
      MB:[38,'상사가 만든 일을 당신이 수습한 1년. 올해 야근의 절반은 상사의 열정에서 왔습니다.'],
      MG:[61,'결재만 받으면 자유. 대신 공은 위로 올라가니 한 일은 꼭 기록해 두세요.']},
  TG:{TB:[64,'상사는 "아직이야?" 묻고, 당신은 이미 끝내놨다. 보고 타이밍만 맞추면 평화.'],
      TG:[88,'말 안 해도 통하는 효율 콤비. 팀 전체가 칼퇴하는 기적이 일어납니다.'],
      MB:[29,'효율적으로 끝낸 일을 상사가 다시 하라고 한다. 올해 제일 많이 한 말은 "네 알겠습니다".'],
      MG:[73,'서로 건드리지 않는 평화조약. 큰 사고만 없으면 연말까지 무사합니다.']},
  MB:{TB:[70,'열심히 달리는데 방향이 자꾸 틀어진다. 상사가 잡아주면 내년에 크게 성장해요.'],
      TG:[80,'상사가 방향을 주면 당신이 달린다. 묻는 걸 부끄러워하지만 않으면 최고의 팀.'],
      MB:[44,'둘 다 열정 만렙. 일은 많은데 왜 늘었는지 아무도 모르는 한 해.'],
      MG:[52,'아무도 안 시킨 일을 만드는 당신, 아무것도 안 시키는 상사. 그래도 팀은 굴러갑니다.']},
  MG:{TB:[33,'상사의 "확인 부탁드려요"가 제일 무서웠던 1년. 메신저 알림에 놀란 횟수 측정 불가.'],
      TG:[77,'상사가 알아서 정리해줘서 편했던 해. 내년엔 하나만 먼저 해보세요.'],
      MB:[41,'상사의 열정을 온몸으로 받아낸 1년. 버틴 것만으로 우수사원입니다.'],
      MG:[68,'세상 평화로운 팀. 마감 전날만 빼고요.']}
};
const STAMP = s => s>=85?'천생연분':s>=70?'결재 승인':s>=50?'보류':'반려';

// ── 질문: axis s=판단(똑+), d=부지런(부+), bs/bd=상사 ──
const QS = [
  {axis:'d',w:1.5,q:'금요일 오후 5시 40분, 갑자기 업무 요청이 왔어요. 나는?',a:['지금 끝내고 마음 편히 퇴근한다','월요일 오전 첫 일정으로 잡아둔다']},
  {axis:'s',w:1.5,q:'처음 맡은 업무, 어떻게 시작해요?',a:['비슷한 선례나 지난 자료부터 찾는다','일단 해보면서 감을 잡는다']},
  {axis:'d',w:1,q:'출근하면 제일 먼저 하는 일은?',a:['오늘 할 일 목록부터 정리한다','커피 마시며 천천히 시동을 건다']},
  {axis:'s',w:1,q:'업무 메일은 어떻게 써요?',a:['결론부터 세 줄로 쓴다','인사와 배경부터 정중하게 쓴다']},
  {axis:'d',w:1,q:'회의가 끝났어요. 회의록은 누가 써요?',a:['내가 이미 쓰고 있다','누군가 쓰겠지…']},
  {axis:'s',w:1,q:'매주 반복되는 엑셀 작업이 생겼어요. 나는?',a:['함수나 템플릿부터 만든다','손이 기억할 때까지 한다']},
  {axis:'d',w:1,q:'올해 내 연차, 지금 얼마나 남았어요?',a:['아직 꽤 남았다','계획대로 거의 다 썼다']},
  {axis:'s',w:1,q:'상사가 "이거 좀 알아서 해줘"라고 해요. 나는?',a:['의도와 마감부터 되묻는다','일단 열심히 알아서 해본다']},
  {axis:'bs',boss:1,q:'우리 상사의 업무 지시는 어때요?',a:['방향이 분명하고 잘 안 바뀐다','자주 바뀌어서 다시 하게 된다']},
  {axis:'bd',boss:1,q:'우리 상사는 일을 어떻게 맡겨요?',a:['직접 챙기고 수시로 체크한다','맡겨두고 결과만 본다']}
];

const app = document.getElementById('app');
let ans = [];

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(t._h);t._h=setTimeout(()=>t.hidden=true,2200)}

function intro(){
  app.innerHTML = `
  <section class="sheet">
    <div class="doc-head">
      <div class="docno">2026 연말 결산</div>
      <div class="approval" aria-label="결재란">
        <div><span>담당</span><i><div class="seal">나</div></i></div>
        <div><span>팀장</span><i></i></div>
        <div><span>본부장</span><i></i></div>
      </div>
    </div>
    <h1 class="hero-title">올해 나와 상사,<br><span class="mark">결재 승인</span>일까?</h1>
    <p class="hero-sub">질문 10개에 답하면 내 일하는 스타일과 상사와의 궁합을 알려드려요. 내 얘기 8개, 상사 얘기 2개예요.</p>
    <div class="cast">
      ${['TB','TG','MB','MG'].map(k=>`<figure>${CHAR[k]}<figcaption><b>${TYPES[k].code}</b>${TYPES[k].def.replace(' + ','<br>')}</figcaption></figure>`).join('')}
    </div>
    <p class="legend"><b>똑/멍</b>은 일하는 방식이에요. 계획부터 세우면 똑, 일단 부딪히면 멍.<br><b>부/게</b>는 일에 손이 가는 속도예요. 바로 하면 부, 여유 있게 하면 게.</p>
    <div class="meta-row"><span>약 1분</span><span>로그인 없음</span><span>결과 무료</span></div>
  </section>
  <button class="btn" id="start">테스트 시작하기</button>
  <p class="fine">상사에게 들키지 않게 조용히 해보세요.</p>`;
  document.getElementById('start').onclick=()=>{ans=[];quiz(0)};
}

function quiz(i){
  const Q = QS[i];
  app.innerHTML = `
  <div class="progress">
    <button class="back" id="back">${i?'← 이전':'← 처음'}</button>
    <div class="bar"><i style="width:${(i)/QS.length*100}%"></i></div>
    <span class="count">${i+1}/${QS.length}</span>
  </div>
  <section class="sheet">
    ${i===8?'<p class="hint">여기부터는 상사에 대한 질문이에요. 지금 상사를 떠올려 주세요.</p>':''}
    <span class="section-tag ${Q.boss?'boss':''}" style="${i===8?'margin-top:10px':''}">${Q.boss?'상사에 대해':'나에 대해'}</span>
    <h2 class="q">${Q.q}</h2>
    <div class="opts">
      ${Q.a.map((t,k)=>`<button class="opt ${ans[i]===k?'picked':''}" data-k="${k}"><b>${'AB'[k]}</b><span>${t}</span></button>`).join('')}
    </div>
  </section>
  `;
  document.getElementById('back').onclick=()=> i?quiz(i-1):intro();
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    ans[i]=+b.dataset.k; b.classList.add('picked');
    setTimeout(()=> i+1<QS.length?quiz(i+1):loading(), 180);
  });
  window.scrollTo(0,0);
}

function loading(){
  app.innerHTML=`<div class="loading"><div class="seal">결재</div><h2>상사에게 결재 올리는 중…</h2><p class="hero-sub">반려되지 않기를 빌어요</p></div>`;
  setTimeout(result,1300);
}

function score(){
  let s=0,d=0;
  QS.forEach((Q,i)=>{const v=ans[i]===0?1:-1; if(Q.axis==='s')s+=v*Q.w; if(Q.axis==='d')d+=v*Q.w;});
  const me=(s>0?'T':'M')+(d>0?'B':'G');
  const boss=(ans[8]===0?'T':'M')+(ans[9]===0?'B':'G');
  return {me,boss};
}

function result(){
  const {me,boss}=score(), T=TYPES[me], B=TYPES[boss], [sc,line]=MATCH[me][boss];
  app.innerHTML=`
  <div class="summary"><p>나의 2026 회사생활 결과</p><h1>나는 ${T.code} ${T.name},<br>상사 궁합은 ${sc}점</h1></div>
  <section class="sheet">
    <div class="res-top">
      ${CHAR[me]}
      <div style="min-width:0">
        <p class="res-type">${T.obj} 캐릭터</p>
        <h1 class="res-name">${T.name}</h1>
        <p class="res-line">“${T.line}”</p>
      </div>
    </div>
    <p class="typedef"><b>${T.code}</b> = ${T.def} 유형</p>
    <p class="desc">${T.desc}</p>
    <div class="slip-cap"><p class="label">올해 나를 숫자로 보면</p><span>재미로 보는 수치예요</span></div>
    <div class="slip">
      ${T.slip.map(r=>`<div class="slip-row"><span>${r[0]}</span><span>${r[1]}</span></div>`).join('')}
      <div class="slip-row total"><span>${T.total[0]}</span><span>${T.total[1]}</span></div>
    </div>
  </section>

  <section class="sheet match">
    <span class="big-stamp">${STAMP(sc)}</span>
    <p class="label">상사 궁합 (100점 만점)</p>
    <div class="match-head" style="margin-top:8px">
      <div class="score">${sc}<small>점</small></div>
      <div class="duo">${CHAR[me]}<em>×</em>${CHAR[boss]}</div>
    </div>
    <div class="gauge"><i style="width:${sc}%"></i></div>
    <p class="verdict">나 ${T.code} × 상사 ${B.code} · 결과 <b style="color:var(--stamp)">${STAMP(sc)}</b></p>
    <p class="desc" style="margin-top:6px">${line}</p>
  </section>

  <section class="sheet locked">
    <p class="label">더 자세한 풀이 · 유료</p>
    <h3 style="font-size:22px;margin-top:6px">우리 상사 공략집 2027</h3>
    <ol>
      <li>${B.code} 상사에게 먹히는 보고 타이밍</li>
      <li>절대 하면 안 되는 말 3가지</li>
      <li>2027 상반기 내 직장운 흐름</li>
      <li>나와 잘 맞는 동료 유형</li>
    </ol>
    <p class="blur" aria-hidden="true">${B.code} 상사는 월요일 오전보다 목요일 오후 보고에 관대합니다. 결론을 먼저 말하고 대안을 두 개 들고 가면…</p>
    <div class="price"><b>990원</b><span class="fine">12월 오픈 예정</span></div>
    <button class="btn stamp" id="buy" style="margin-top:12px">990원에 전체 풀이 보기</button>
    <div id="fake" hidden></div>
  </section>

  <div class="row2">
    <button class="btn" id="share">동료에게 보내기</button>
    <button class="btn ghost" id="again">다시 하기</button>
  </div>
  <p class="fine">동료에게 보내면 결과 문구가 복사돼요. 메신저에 붙여 넣어 보세요.</p>`;
  window.scrollTo(0,0);

  document.getElementById('again').onclick=()=>{ans=[];intro()};
  document.getElementById('share').onclick=()=>{
    const txt=`나는 ${T.code} ${T.name}, 상사 궁합 ${sc}점(${STAMP(sc)}) 나왔어. 너도 해봐`;
    const done=()=>toast('공유 문구를 복사했어요');
    try{navigator.clipboard.writeText(txt).then(done,()=>toast(txt));}catch(e){toast(txt)}
  };
  document.getElementById('buy').onclick=()=>{
    const f=document.getElementById('fake'); f.hidden=false;
    document.getElementById('buy').hidden=true;
    f.innerHTML=`<div class="fake">
      <strong>상세 풀이는 12월에 열려요</strong>
      <p style="font-size:14px;color:var(--muted)">출시되면 가장 먼저 알려드릴게요. 오픈 기념 첫 풀이는 무료예요.</p>
      <label for="notify" class="label">알림 받을 이메일</label>
      <input id="notify" type="email" placeholder="name@company.com" autocomplete="email">
      <button class="btn" id="notifyBtn">출시 알림 받기</button>
      <p class="fine">프로토타입이라 입력한 내용은 저장되지 않아요.</p>
    </div>`;
    document.getElementById('notifyBtn').onclick=()=>{
      const v=document.getElementById('notify').value.trim();
      if(!/^\S+@\S+\.\S+$/.test(v)){toast('이메일 주소를 확인해 주세요');return}
      f.innerHTML=`<div class="fake"><strong>알림 신청 완료</strong><p style="font-size:14px;color:var(--muted)">12월 오픈 때 ${v}로 알려드릴게요. (프로토타입: 실제 발송 없음)</p></div>`;
    };
  };
}

intro();
</script>
</body></html>
