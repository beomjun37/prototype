<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>사표만 안 내요</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{--paper:#F6F7F9;--sheet:#FFFFFF;--ink:#1E2740;--muted:#5E677E;--line:#D9DDE6;--stamp:#C8352A;--gold:#9A6B12;--marker:#FFE14D;--soft:#EEF1F6;--ok:#1F7D50;
--display:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;--body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#121725;--sheet:#1B2234;--ink:#E9ECF3;--muted:#A2AABE;--line:#2E3750;--stamp:#F0786D;--gold:#E3B95A;--marker:#F5D63D;--soft:#232B40;--ok:#5FCB92;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#121725;--sheet:#1B2234;--ink:#E9ECF3;--muted:#A2AABE;--line:#2E3750;--stamp:#F0786D;--gold:#E3B95A;--marker:#F5D63D;--soft:#232B40;--ok:#5FCB92;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65;word-break:keep-all;padding:20px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;letter-spacing:-.01em;text-wrap:balance}p{margin:0}
button,input{font:inherit;color:inherit}button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--stamp);outline-offset:2px}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:22px 20px}
.label{font-size:13px;font-weight:700;color:var(--muted)}
.muted{color:var(--muted)}
.mark{background:linear-gradient(transparent 55%,var(--marker) 55%);padding:0 2px}
.dark-ink{color:#1E2740}
.btn{display:block;width:100%;min-height:52px;border:0;border-radius:6px;background:var(--ink);color:var(--paper);font-weight:700;font-size:17px;padding:12px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.row{display:flex;gap:8px}.row>*{flex:1}
input[type=text]{width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:6px;background:var(--sheet);padding:10px 12px;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:8px 14px;border:1.5px solid var(--line);border-radius:22px;background:var(--sheet);font-size:15px}
.chip[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:var(--paper);font-weight:700}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:6px;font-size:15px;max-width:calc(100% - 32px);z-index:9}
.fake{border:1.5px dashed var(--gold);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:10px}
.fake b{color:var(--gold)}
.foot{font-size:13px;color:var(--muted);text-align:center}
.foot a{color:inherit}
</style>
</head><body>
<style>
.paper{background:#FFFFFF;color:#1E2740;border:1px solid #D9DDE6;border-radius:4px;padding:26px 22px;box-shadow:0 2px 0 #D9DDE6}
.paper h2{font-size:34px;text-align:center;letter-spacing:.4em;padding-left:.4em}
.paper .ln{border-bottom:1px solid #D9DDE6;padding:8px 0;font-size:16px}
.track{display:flex;flex-direction:column;gap:0}
.step{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:start;padding:12px 0;border-left:3px solid var(--line);margin-left:26px;padding-left:0;position:relative;opacity:.35;transition:opacity .3s}
.step.on{opacity:1;border-color:var(--stamp)}
.step svg{width:52px;height:auto;margin-left:-28px;background:var(--paper);border-radius:50%}
.step .who{font-weight:700}
.step .say{font-size:15px;color:var(--muted)}
.big{font-family:var(--display);font-size:56px;line-height:1;color:var(--stamp)}
.ended{border:3px solid var(--stamp);color:var(--stamp);font-family:var(--display);font-size:24px;padding:6px 14px;transform:rotate(-6deg);display:inline-block;border-radius:4px}
input[type=range]{width:100%;height:44px;accent-color:var(--stamp)}
.hero{font-size:36px;line-height:1.2}
</style>
<div class="wrap" id="app"></div><div class="toast" id="toast" hidden></div>
<script>
const FACE = (x,y,c)=>`<circle cx="${x-9}" cy="${y}" r="3.2" fill="${c}"/><circle cx="${x+9}" cy="${y}" r="3.2" fill="${c}"/>`;
const CHAR = {
  TB:`<svg viewBox="0 0 120 120" aria-hidden="true"><rect x="14" y="70" width="92" height="22" rx="8" fill="#3A4A7A"/><path d="M18 70 Q20 44 60 42 L100 46 Q106 48 104 60 L102 70 Z" fill="#5468A8"/><rect x="92" y="60" width="14" height="10" rx="3" fill="#C9CFDD"/>${FACE(52,58,'#fff')}<path d="M45 66 h14" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M68 34 l6 -10 M78 38 l10 -8" stroke="#D23A2E" stroke-width="3" stroke-linecap="round"/></svg>`,
  TG:`<svg viewBox="0 0 120 120" aria-hidden="true"><path d="M48 22 q-6 -8 0 -14 M62 24 q-6 -8 0 -14" stroke="#9BA3B8" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M84 52 h8 a14 14 0 0 1 0 28 h-8" stroke="#E8A33A" stroke-width="7" fill="none"/><rect x="26" y="36" width="60" height="62" rx="10" fill="#F2B544"/><rect x="26" y="36" width="60" height="10" rx="5" fill="#D9962C"/><path d="M40 64 q5 -4 10 0 M62 64 q5 -4 10 0" stroke="#1E2740" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M50 78 q6 5 12 0" stroke="#1E2740" stroke-width="3" fill="none" stroke-linecap="round"/></svg>`,
  MB:`<svg viewBox="0 0 120 120" aria-hidden="true"><path d="M20 22 h80 v58 l-20 20 h-60 z" fill="#FFE14D"/><path d="M100 80 l-20 20 v-20 z" fill="#E5C42F"/>${FACE(60,54,'#1E2740')}<path d="M50 66 q10 10 20 0" stroke="#1E2740" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M96 14 l6 -6 M104 22 l8 -2 M88 10 l0 -6" stroke="#D23A2E" stroke-width="3" stroke-linecap="round"/></svg>`,
  MG:`<svg viewBox="0 0 120 120" aria-hidden="true"><path d="M60 54 q-26 -6 -30 -30 q24 2 30 30 M60 54 q24 -10 34 -32 q-26 0 -34 32" fill="#4FA36A"/><path d="M60 58 v-10" stroke="#3B8454" stroke-width="4"/><path d="M30 58 h60 l-8 44 h-44 z" fill="#C8734A"/><rect x="26" y="54" width="68" height="10" rx="3" fill="#B0603A"/><path d="M44 80 h8 M68 80 h8" stroke="#1E2740" stroke-width="3" stroke-linecap="round"/><path d="M56 90 h8" stroke="#1E2740" stroke-width="3" stroke-linecap="round"/></svg>`
};
const MATCH = {
  TB:{TB:[82,'회의가 15분 만에 끝나는 사이. 둘 다 쉬지 않아서 팀원들이 숨 막혀 할 수 있어요.'],
      TG:[95,'올해 최고의 조합. 상사는 방향만, 당신은 실행. 올해 성과는 당신 이름으로 남아요.'],
      MB:[38,'상사가 만든 일을 당신이 수습한 1년. 올해 야근의 절반은 상사의 열정에서 왔습니다.'],
      MG:[61,'결재만 받으면 자유. 대신 공은 위로 올라가니 한 일은 꼭 기록해 두세요.']},
  TG:{TB:[64,'상사는 "아직이야?" 묻고, 당신은 이미 끝내놨다. 보고 타이밍만 맞추면 평화.'],
      TG:[88,'말 안 해도 통하는 효율 콤비. 팀 전체가 칼퇴하는 기적이 일어납니다.'],
      MB:[29,'효율적으로 끝낸 일을 상사가 다시 하라고 한다. 올해 제일 많이 한 말은 "네 알겠습니다".'],
      MG:[73,'서로 건드리지 않는 평화조약. 큰 사고만 없으면 연말까지 무사합니다.']},
  MB:{TB:[70,'열심히 달리는데 방향이 자꾸 틀어진다. 상사가 잡아주면 내년에 크게 성장해요.'],
      TG:[80,'상사가 방향을 주면 당신이 달린다. 묻는 걸 부끄러워하지만 않으면 최고의 팀.'],
      MB:[44,'둘 다 열정 만렙. 일은 많은데 왜 늘었는지 아무도 모르는 한 해.'],
      MG:[52,'아무도 안 시킨 일을 만드는 당신, 아무것도 안 시키는 상사. 그래도 팀은 굴러갑니다.']},
  MG:{TB:[33,'상사의 "확인 부탁드려요"가 제일 무서웠던 1년. 메신저 알림에 놀란 횟수 측정 불가.'],
      TG:[77,'상사가 알아서 정리해줘서 편했던 해. 내년엔 하나만 먼저 해보세요.'],
      MB:[41,'상사의 열정을 온몸으로 받아낸 1년. 버틴 것만으로 우수사원입니다.'],
      MG:[68,'세상 평화로운 팀. 마감 전날만 빼고요.']}
};
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2400)}
function copy(txt,msg){const d=()=>toast(msg||'링크를 복사했어요. 단톡방에 붙여넣어 주세요');try{navigator.clipboard.writeText(txt).then(d,()=>prompt('복사해서 보내세요',txt))}catch(e){prompt('복사해서 보내세요',txt)}}
function share(title,url){if(navigator.share){navigator.share({title,url}).catch(()=>{})}else copy(url)}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// 실명·회사명 대신 별명만: 8자 제한, 회사 표기 제거
const BAN=/(주식회사|\(주\)|㈜|그룹|전자|은행|증권|시발|씨발|병신|개새|좆|존나)/g;
const nick=s=>(s||'').replace(BAN,'').replace(/[<>#&~.]/g,'').trim().slice(0,8);
const hp=()=>Object.fromEntries(new URLSearchParams(location.hash.slice(1)));
const base=()=>location.href.split('#')[0];

const WHY=['상사 때문에','야근 때문에','월급 때문에','회의 때문에','그냥 다 싫어서','제주도 가고 싶어서'];
const LINE=[
 ['TB','팀장 철컥이','"사유가 한 줄이네요. 세 줄로 다시 써 오세요." (철컥)'],
 ['TG','부장 느긋컵','"음… 커피 한 잔 하고 얘기할까?" 커피가 식을 때까지 보류 중'],
 ['MB','인사팀 붙임이','"퇴직 서류 7종 붙여드렸어요!" 포스트잇이 12장 늘었다'],
 ['MG','대표 광합이','결재 직전, 사내 공지가 떴다: <b>연말 성과급 지급 예정</b>']
];
const TITLE=n=>n>=100?['사표 장인','매일 쓰고 매일 접었다. 이 정도면 수행이에요.']:n>=40?['인내의 달인','주 1회 이상 참았어요. 내년엔 덜 참을 일만 있기를.']:n>=10?['평범한 직장인','한 달에 한 번쯤은 다들 그래요. 정상입니다.']:n>=1?['평화주의자','거의 안 흔들렸네요. 비결 좀 알려주세요.']:['전설의 신입','사표 생각이 0번이라니. 혹시 회사가 좋으신가요?'];
let st={who:'',why:0,n:20};
const app=document.getElementById('app');
function home(){
 app.innerHTML=`<div class="sheet"><p class="label">연말 한정 · 3분 체험</p><h1 class="hero">사표,<br>써보기만 <span class="mark">합시다</span></h1>
 <p class="muted" style="margin-top:10px">진짜로 내진 않아요. 결재 라인을 따라가는 내 사표를 지켜보세요.</p></div>
 <div class="sheet" style="display:flex;flex-direction:column;gap:14px">
  <label><span class="label">내 별명 (8자까지)</span><input type="text" id="who" maxlength="8" placeholder="예) 3년차 김" value="${esc(st.who)}"></label>
  <div><p class="label" style="margin-bottom:8px">퇴사 사유</p><div class="chips">${WHY.map((w,i)=>`<button class="chip" aria-pressed="${i==st.why}" data-i="${i}">${w}</button>`).join('')}</div></div>
  <label><span class="label">올해 사표 생각, 몇 번 했어요? <b id="nv" style="color:var(--ink)">${st.n}번</b></span><input type="range" id="n" min="0" max="200" value="${st.n}"></label>
  <button class="btn" id="go">사표 제출하기</button></div>
 <p class="foot">자체 캐릭터 · 아무것도 저장되지 않아요 · 실제 회사와 무관한 놀이예요</p>`;
 app.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{st.why=+b.dataset.i;app.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c===b))});
 n.oninput=()=>{st.n=+n.value;nv.textContent=st.n+'번'};
 go.onclick=()=>{st.who=nick(who.value)||'익명 직장인';track()};
}
function track(){
 app.innerHTML=`<div class="paper"><h2>사직서</h2><div class="ln">성명: ${esc(st.who)}</div><div class="ln">사유: ${WHY[st.why]}</div><div class="ln">위와 같은 사유로 사직하고자 합니다.</div></div>
 <div class="sheet"><p class="label" style="margin-bottom:6px">결재 진행 상황</p><div class="track">${LINE.map(l=>`<div class="step">${CHAR[l[0]]}<div><p class="who">${l[1]}</p><p class="say">${l[2]}</p></div></div>`).join('')}</div></div>
 <div id="out" style="display:flex;flex-direction:column;gap:16px"></div>`;
 const steps=[...app.querySelectorAll('.step')];let i=0;
 const fast=matchMedia('(prefers-reduced-motion: reduce)').matches;
 (function nx(){if(i<steps.length){steps[i++].classList.add('on');setTimeout(nx,fast?50:1100)}else end()})();
 scrollTo(0,0);
}
function end(){
 const t=TITLE(st.n);
 out.innerHTML=`<div class="sheet" style="text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center">
  <span class="ended">사표 회수됨</span>
  <p>성과급 공지를 본 ${esc(st.who)} 님은 조용히 사표를 회수했습니다.</p>
  <p class="label">올해 참은 사표</p><p class="big">${st.n}번</p>
  <h2 style="font-size:28px">${t[0]}</h2><p class="muted">${t[1]}</p></div>
 <button class="btn" id="sh">친구에게 사표 써보라고 보내기</button>
 <div class="fake"><p><b>990원</b> 나랑 상사 궁합 결과 보기</p><p class="muted" style="font-size:15px">사표를 부른 그 상사, 나랑 궁합은 몇 점일까요?</p><a class="btn ghost" style="text-align:center;text-decoration:none" href="../boss-fit/">궁합 보러 가기</a></div>
 <button class="btn ghost" id="again">다시 써보기</button>`;
 sh.onclick=()=>share('나는 올해 사표를 '+st.n+'번 참았다',base()+'#n='+st.n);
 again.onclick=home;
 out.scrollIntoView({behavior:'smooth',block:'start'});
}
const h=hp(); if(h.n!=null&&!isNaN(+h.n))st.n=Math.min(200,Math.max(0,+h.n));
home();
</script>

</body></html>
