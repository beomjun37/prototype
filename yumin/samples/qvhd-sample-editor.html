<title>QVHD 샘플 결과지</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 칸별 세로 목록. 각 문장은 그 자리에서 바로 고치는 입력 칸이고 자동 저장 */
:root{--bg:#f6f7f5;--surface:#ffffff;--fg:#1d2421;--muted:#5d6762;--line:#dfe3df;--c:#2f6f62;--c-bg:#e6f1ee;--n:#9a5b2a;--n-bg:#f6ebe1;--ok:#2f6f62;--warn:#a2561a;--focus:#1d2421;
--font:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181a;--surface:#1c2225;--fg:#e8ece9;--muted:#9aa5a0;--line:#2c3437;--c:#6fc2b0;--c-bg:#1b2b28;--n:#e0a272;--n-bg:#2d2319;--ok:#6fc2b0;--warn:#e0a272;--focus:#e8ece9;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14181a;--surface:#1c2225;--fg:#e8ece9;--muted:#9aa5a0;--line:#2c3437;--c:#6fc2b0;--c-bg:#1b2b28;--n:#e0a272;--n-bg:#2d2319;--ok:#6fc2b0;--warn:#e0a272;--focus:#e8ece9;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.7;padding-block:20px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:880px;margin:0 auto}
h1{font-size:22px;line-height:1.35;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 14px;font-size:13.5px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--muted);margin:0 0 12px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:5;display:flex;flex-direction:column;gap:6px}
.seg{display:flex;gap:6px}
.seg button{flex:1;font:inherit;font-size:14px;font-weight:500;padding:10px 8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.seg button:focus-visible,.act:focus-visible,.rv:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.st{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted)}
.st b{color:var(--fg);font-weight:500}
.act{font:inherit;font-size:12.5px;padding:5px 10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;cursor:pointer;white-space:nowrap}
.cell{margin:22px 0 0}
.ch{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:0 0 8px}
.ch h2{font-size:16px;margin:0}
.ch .no{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.chip{font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.row{display:grid;gap:10px;grid-template-columns:1fr}
.box{border-radius:10px;padding:12px 14px;min-width:0;border:1px solid var(--line)}
.box.c{background:var(--c-bg)}.box.n{background:var(--n-bg)}
.tag{font-size:12px;font-weight:700;margin:0 0 6px}
.box.c .tag{color:var(--c)}.box.n .tag{color:var(--n)}
.lab{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin:10px 0 2px}
.f{margin:0}
.f textarea{display:block;width:100%;box-sizing:border-box;font:inherit;font-size:16px;line-height:1.65;color:var(--fg);background:transparent;border:1px solid transparent;border-radius:6px;padding:4px 6px;margin:0 -6px;width:calc(100% + 12px);resize:none;overflow:hidden}
.f textarea:hover{border-color:var(--line)}
.f textarea:focus{outline:none;border-color:var(--focus);background:var(--surface)}
.f.mod textarea{border-left:3px solid var(--warn)}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted);min-height:20px}
.cnt{font-variant-numeric:tabular-nums}
.cnt.bad{color:var(--warn);font-weight:700}
.rv{font:inherit;font-size:12px;border:none;background:none;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0}
.story-wrap{border-top:1px dashed var(--line);margin-top:8px;padding-top:2px}
h3{font-size:16px;margin:32px 0 8px}
.bd{display:grid;gap:8px}
.bd .box{background:var(--surface)}
.pv{font-size:12.5px;color:var(--muted);margin:2px 0 0;overflow-wrap:anywhere}.pv b{color:var(--fg);font-weight:500}
.pre{width:100%;min-height:140px;box-sizing:border-box;font:inherit;font-size:14px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
@media (min-width:720px){.row.both{grid-template-columns:1fr 1fr}}
.row.only-c .n,.row.only-n .c{display:none}
</style>

<script>
var D={"meta": {"type": "QVHD (INFJ)", "base": "조용히 한 마디로 길을 보여 주는 내향·큰 그림·사람 중심·계획형", "note": "초안 v1.1 (11/22에 이 버전을 샘플 초안으로 확정). AI 초안에 김유민 님 수정이 반영된 상태이고, 팀 검수 전 단계. C=자기 판단을 믿어서 평온, N=결정 전에 한 번 더 따져 보는 신중함(11/18 회의 정의). 이름은 현행 코드 유지. 11/21 체크리스트 v4 기준 개선: 정체에 공감 한 줄, 멘탈 반응을 공감 문장으로 시작, 힘든 순간 N 본문과 에피소드를 같은 상황으로, 경계 문구를 두 문장으로 다시 썼습니다."}, "cells": [{"no": 1, "cell": "정체", "unit": "32유형", "limit": [0, 0], "C": {"name": "조용한멘토 도차장", "line": "말수는 적지만 한 마디로 길이 보이게 해 주는 사람", "empathy": "혼자 있는 시간이 좋은데, 누가 힘들어 보이면 어느새 옆에 가 있어요."}, "N": {"name": "상담소장 길차장", "line": "남의 사정을 오래 기억하고, 말은 한 번 더 고르는 사람", "empathy": "서두르는 건 불편해도, 한번 정하면 끝까지 챙겨요."}}, {"no": 2, "cell": "장면", "unit": "32유형", "limit": [100, 160], "C": "후배가 \"잠깐 시간 되세요?\" 하고 오면 도차장은 하던 일을 저장하고 빈 회의실부터 잡아요. 이야기를 끝까지 들으며 요즘 일이 얼마나 몰렸는지부터 물은 뒤 \"제가 보기엔 이 부분부터 풀면 될 것 같아요\" 하고 핵심을 짚어 줘요. 후배 입장에서는 답답했던 속이 뻥 뚫리는 느낌이에요.", "N": "후배가 점심 직전에 어렵게 고민을 털어놓으면, 길차장은 답을 서두르지 않아요. \"내일 아침에 다시 얘기해도 될까요?\" 하고 말해요. 다음 날 아침 가장 먼저 그 후배 자리로 가서, 어제 들은 이야기에서 제일 마음에 걸렸던 부분부터 꺼내요."}, {"no": 3, "cell": "빛나는 순간", "unit": "32유형", "limit": [100, 160], "C": "새 프로젝트 킥오프에서 역할 분담을 두고 말이 엇갈릴 때가 도차장의 차례예요. 다들 자기 몫을 주장하는 동안 가만히 듣다가, 누가 지금 어떤 일로 바쁜지부터 짚어요. 그다음 각자 맡을 일을 한 문장으로 묶어요. 그 덕분에 킥오프가 \"그럼 이렇게 나눠 봅시다\"로 끝나요.", "N": "후배와 길게 이야기하는 연말 면담이 길차장의 자리예요. 올해 한 일만 되짚지 않고, 내년에 이 사람이 어디쯤 가 있으면 좋을지를 먼저 그려서 보여 줘요. 면담이 끝난 뒤 후배가 \"제가 뭘 하고 싶은지 처음 알았어요\"라고 말해요."}, {"no": 4, "cell": "힘든 순간", "unit": "32유형", "limit": [100, 170], "C": "결과만 따지는 분위기에서 에너지가 새요. 각자의 사정은 제쳐 두고 숫자만 오가는 회의가 길어지면 말수가 점점 줄어요. 사람 얘기를 꺼낼 틈이 안 보이는 날일수록, 회의가 끝난 뒤에도 기운이 한참 빠져 있어요.", "N": "확인이 안 된 이야기를 당장 정하라고 재촉받을 때 힘들어요. 한 번 더 따져 보고 싶은 마음과 서두르는 분위기가 부딪혀요. 확인이 길어지면 팀이 기다리는 시간도 길어지고, 그만큼 눈치도 보여요.", "story": {"C": "실적 회의에서 팀원 한 명이 \"요즘 야근이 너무 많아서요\" 하고 말을 꺼내자, 팀장이 \"그건 다음 안건에서 보죠\" 하고 넘겨요. 도차장은 팀원의 말이 그렇게 넘어간 게 마음에 걸려 남은 회의 내내 한 마디도 못 해요. 회의가 끝난 뒤에도 자리에서 한참 일어나지 못해요.", "N": "팀장이 \"오늘 안으로 방향만 정해 주세요\" 하고 지나가면, 길차장은 이 방향으로 일이 몰리는 사람이 없는지부터 확인해요. 점심 전에 \"조금만 더 보고 말씀드릴게요\"를 두 번 말하고, 오후가 돼서야 결론을 들고 가요.", "limit": [90, 150]}}, {"no": 5, "cell": "멘탈 반응", "unit": "32유형", "limit": [140, 220], "C": "겉으로는 별일 아닌 듯 넘기다가도 큰 결정 앞에서는 한 번쯤 멈칫해요. 의견이 갈려도 근거를 미리 정리해 둬서 다른 의견을 \"그럴 수 있죠\" 하고 받아들여요. 퇴근길에는 그날 일 생각을 내려놓아요. 다만 확신이 큰 일일수록 다른 사람이 문제를 짚어 줘야 그제야 다시 보기도 해요.", "N": "미리 따져 보는 게 습관이라 느려 보이지만, 한번 정하면 쉽게 흔들리지 않아요. 의견이 갈리면 내 쪽 근거부터 한 번 더 따져 보고, 어긋날 만한 경우를 미리 그려 둬요. 그 덕에 막상 일이 닥치면 오히려 차분해요. 다만 결론부터 요구하는 자리에서는 아직 정하지 못한 사람처럼 보이기도 해요.", "story": {"C": "상사가 \"내일 잠깐 보죠\"라고 메신저를 보내면 도차장은 \"무슨 얘기든 만나서 들으면 되죠\" 하고 하던 일을 이어 가요. 다음 날 신규 프로젝트 제안이었다는 걸 알았을 때도 크게 놀라지 않고 \"좋아요, 같이 볼게요\" 하고 답해요.", "N": "상사가 \"내일 잠깐 보죠\"라고 메신저를 보내면, 길차장은 지금 맡은 일의 현황을 한 장으로 정리해 둬요. 어떤 얘기가 나와도 답할 수 있게요. 다음 날 신규 프로젝트 제안이 나오자 \"현재 상태는 이렇고, 새로 맡으면 여기가 걸려요\" 하고 막힘없이 말을 이었어요.", "limit": [90, 150]}}, {"no": 6, "cell": "한마디", "unit": "32유형", "limit": [0, 0], "C": "\"제 생각은 이 방향이에요. 근거는 정리해 놨으니, 걸리는 부분 있으면 바로 말씀해 주세요.\"", "N": "\"그 부분은 제가 한 번 더 확인해 보고 오늘 안에 말씀드릴게요. 기다리시는 분들 일정에는 지장 없게 챙겨 둘게요.\""}, {"no": 7, "cell": "올해 총평", "unit": "32유형", "limit": [120, 200], "C": "올해 도차장은 \"도차장님한테 물어봐\"라는 말을 가장 많이 들은 사람이에요. 조용히 있다가 꺼낸 한 마디가 팀 방향을 여러 번 바꿔 놓았고, 후배들은 그 한 마디를 오래 기억했어요. 큰 소리 한 번 내지 않고 팀의 속도를 맞춰 온 한 해였어요.", "N": "올해 길차장은 후배 세 명의 첫 보고서를 옆에서 봐 준 사람이에요. 일정표를 미리 짜 두고 한 번 더 확인하는 성격 덕에 팀이 놓칠 뻔한 일정을 두 번 막았어요. 후배들은 길차장 앞에서 속 얘기를 편하게 꺼냈고요. 팀이 크게 흔들리지 않은 데는 길차장의 확인이 한몫했어요.", "story": {"C": "11월에 팀을 떠난 동료의 송별 카드에 후배들이 쓴 말을 모아 보니, \"도차장님 덕분에 첫 보고서를 끝냈어요\"가 세 번 나왔어요. 도차장은 카드를 접어 서랍에 넣으면서 \"내가 그렇게 말했던가\" 하고 웃었어요.", "N": "12월 팀 연말 피어리뷰에 후배 한 명이 \"길차장님께 고민을 터놓은 날은 마음이 편안해졌어요\"라고 적었어요. 길차장은 그 문장을 한참 들여다보다 캡처해서 휴대폰 첫 화면에 걸어 두었어요.", "limit": [90, 150]}}, {"no": 8, "cell": "한 줄 처방", "unit": "32유형", "limit": [40, 70], "C": "이번 주 회의에서 한 번은 누가 묻기 전에 먼저 생각을 말해 보고, 반응이 어땠는지 기억해 두세요.", "N": "모든 내용이 확인되기 전이라도 70%쯤 정리됐을 때, 한 줄로 먼저 공유하고 나머지는 이어서 알려 주세요."}], "boundary": {"note": "2:1로 끝난 축에만 표시. 두 문장 구성: 평소 모습, 예외 상황과 그때의 행동(요약 문장 없음). 공용 문구에 {이름은}, {이름이} 같은 자리표시자를 넣어 결과 화면에서 도차장 또는 길차장으로 바뀝니다(11/21 결정). 한 결과지에서 이름이 같은 자리에서 반복되지 않게 위치를 섞었고, 마감 리듬은 이름을 생략했습니다. 11/22 결정(H9): 경계 문구 앞에 사용자가 실제로 고른 선택지를 인용하는 한 문장을 둡니다. {답변1}, {답변2}는 코드가 사용자의 실제 선택(선택지 윗줄)으로 채웁니다. 한 결과지에서 1~2번만 쓰므로 표시되는 경계 축 중 앞의 두 축(충전, 일을 보는 눈)에만 넣었습니다. 아래 예시 선택은 샘플용입니다.", "Q": "'{답변1}'와 '{답변2}'를 둘 다 고르셨어요. 점심시간에는 혼자 걷거나 조용히 쉬면서 기운을 채워요. 그런데 혼자서는 안 풀리는 문제가 생긴 날에는 옆 팀 자리까지 찾아가 \"잠깐 이것 좀 같이 볼까요\" 하고 먼저 말을 걸어요.", "V": "'{답변1}'와 '{답변2}'를 둘 다 고르셨어요. 새 일을 받으면 {이름은} 이게 결국 어디로 이어지는지가 먼저 궁금해요. 마감이 코앞인 날에는 큰 그림은 접어 두고 오늘 할 일 목록부터 만들어요.", "H": "결정을 내릴 때 {이름은} 그 결정에 영향받는 사람들의 사정부터 살펴요. 숫자나 원칙이 분명한 일에서는 기준표를 꺼내 깔끔하게 정리해서 말해요.", "D": "맡은 일은 일정표를 짜서 미리 끝내 두는 쪽이에요. 흥미가 안 가는 일은 마감 직전까지 열어 보지 않고 미뤄 두기도 해요.", "C": "예상 밖의 일이 터져도 {이름은} 자기 판단을 믿고 평온하게 움직여요. 되돌리기 어려운 큰 결정 앞에서는 근거를 한 번 더 따져 보고 나서 정해요.", "N": "움직이기 전에 {이름은} 빠진 게 없는지 한 번 더 확인해요. 익숙해서 여러 번 해 본 일은 확인을 줄이고 자신 있게 밀고 가요.", "echoSample": {"Q": ["혼자 먹으러 간다", "옆 사람한테 말해 본다"], "V": ["이유부터 알고 싶다", "현실성부터 따진다"]}}};
var view="both",over={},F={},db=null,canWrite=true,timers={},chain={},LS="qvhd-editor-v1";
function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
function cur(k){return Object.prototype.hasOwnProperty.call(over,k)?over[k]:F[k].base;}
function field(key,base,limit,label,rows){
  F[key]={base:base,limit:limit};
  return (label?"<span class=\"lab\">"+esc(label)+"</span>":"")+"<div class=\"f\" data-key=\""+key+"\"><textarea data-key=\""+key+"\" rows=\""+(rows||2)+"\" spellcheck=\"false\" aria-label=\""+esc(label||key)+"\"></textarea><div class=\"meta\"><span class=\"cnt\"></span><button type=\"button\" class=\"rv\" hidden>원문으로 되돌리기</button></div></div>";
}
function render(){
  F={};
  $("note").textContent=D.meta.note+" 길이 기준은 11/21 제안이며 팀 확정 전입니다.";
  var h="";
  D.cells.forEach(function(c){
    var lim=c.limit[1]?c.limit[0]+"~"+c.limit[1]+"자":"한 줄";
    var cls=view==="both"?"both":"only-"+view;
    h+="<section class=\"cell\"><div class=\"ch\"><span class=\"no\">"+c.no+"</span><h2>"+esc(c.cell)+"</h2><span class=\"chip\">"+lim+"</span></div><div class=\"row "+cls+"\">";
    ["C","N"].forEach(function(k){
      var v=c[k],label=k==="C"?"C 조용한멘토 도차장":"N 상담소장 길차장";
      h+="<div class=\"box "+k.toLowerCase()+"\"><div class=\"tag\">"+label+"</div>";
      if(typeof v==="object"){
        h+=field("c"+c.no+"_"+k+"_name",v.name,null,"이름",1)+field("c"+c.no+"_"+k+"_line",v.line,null,"한 줄 소개",2);
        if(v.empathy!==undefined){h+=field("c"+c.no+"_"+k+"_empathy",v.empathy,null,"공감 한 줄",2);}
      }else{
        h+=field("c"+c.no+"_"+k,v,c.limit[1]?c.limit:null,null,c.limit[1]>120?5:3);
        if(c.story){h+="<div class=\"story-wrap\">"+field("c"+c.no+"_"+k+"_story",c.story[k],c.story.limit,"에피소드",4)+"</div>";}
      }
      h+="</div>";
    });
    h+="</div></section>";
  });
  $("cells").innerHTML=h;
  $("bnote").textContent=D.boundary.note;
  var bh="";
  ["Q","V","H","D","C","N"].forEach(function(k){
    if(view==="c"&&k==="N")return; if(view==="n"&&k==="C")return;
    bh+="<div class=\"box\">"+field("b_"+k,D.boundary[k],null,k+" 쪽",3)+"<div class=\"pv\" data-pv=\"b_"+k+"\"></div></div>";
  });
  $("bd").innerHTML=bh;
  [].forEach.call(document.querySelectorAll("textarea[data-key]"),function(ta){
    ta.value=cur(ta.getAttribute("data-key"));size(ta);meta(ta);preview(ta);
  });
  summary();
}
function nameOf(w){return D.cells[0][w].name.split(" ").pop();}
function josa(n,a,b){var c=n.charCodeAt(n.length-1)-0xAC00;return n+((c>=0&&c%28)?a:b);}
function fillName(t,n,k){var e=(D.boundary.echoSample||{})[(k||"").replace("b_","")]||["",""];return t.replace(/\{답변1\}/g,e[0]).replace(/\{답변2\}/g,e[1]).replace(/\{이름은\}/g,josa(n,"은","는")).replace(/\{이름이\}/g,josa(n,"이","가")).replace(/\{이름을\}/g,josa(n,"을","를"));}
function preview(ta){var key=ta.getAttribute("data-key");if(key.indexOf("b_")!==0)return;var pv=document.querySelector("[data-pv=\""+key+"\"]");if(!pv)return;var v=ta.value;if(v.indexOf("{이름")<0&&v.indexOf("{답변")<0){pv.textContent="";return;}pv.innerHTML="<b>C 버전</b> "+esc(fillName(v,nameOf("C"),key))+"<br><b>N 버전</b> "+esc(fillName(v,nameOf("N"),key));}
function size(ta){ta.style.height="auto";ta.style.height=(ta.scrollHeight+2)+"px";}
function meta(ta){
  var key=ta.getAttribute("data-key"),f=F[key],box=ta.parentNode,cnt=box.querySelector(".cnt"),rv=box.querySelector(".rv");
  var n=ta.value.length,mod=ta.value!==f.base;
  cnt.textContent=n+"자"+(f.limit?" (기준 "+f.limit[0]+"~"+f.limit[1]+")":"");
  cnt.className="cnt"+(f.limit&&(n<f.limit[0]||n>f.limit[1])?" bad":"");
  rv.hidden=!mod;box.className="f"+(mod?" mod":"");
}
function summary(){
  var n=0;Object.keys(over).forEach(function(k){if(F[k]&&over[k]!==F[k].base)n++;});
  var s=$("sum");if(!s){return;}s.textContent=n?("고친 곳 "+n+"곳"):"고친 곳 없음";
}
function setStatus(t){$("status").innerHTML=t;}
function status(msg){setStatus("<b id=\"sum\"></b> · "+msg);summary();}
function localSave(){try{localStorage.setItem(LS,JSON.stringify(over));}catch(e){}}
function schedule(key){clearTimeout(timers[key]);status("입력 중…");timers[key]=setTimeout(function(){save(key);},900);}
function save(key){
  var ta=document.querySelector("textarea[data-key=\""+key+"\"]");var val=ta?ta.value:cur(key);
  delete timers[key];
  if(!db||!canWrite){localSave();status(db?"이 기기에만 저장됨(쓰기 권한 없음)":"이 기기에만 저장됨(공유 저장소 없음)");return;}
  chain[key]=(chain[key]||Promise.resolve()).then(function(){
    var ref=db.doc("edits/"+key);
    return val===F[key].base?ref.delete():ref.set({v:val,t:Date.now()});
  }).then(function(){status("저장됨 "+new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"}));},
  function(e){
    if(e&&e.code==="invalid_argument"){canWrite=false;localSave();status("쓰기 권한이 없어 이 기기에만 저장돼요");}
    else{status("저장 실패. 잠시 뒤 다시 시도해 주세요");}
  });
}
document.addEventListener("input",function(e){
  var ta=e.target;if(!ta.matches||!ta.matches("textarea[data-key]"))return;
  var key=ta.getAttribute("data-key");
  if(ta.value===F[key].base)delete over[key];else over[key]=ta.value;
  size(ta);meta(ta);preview(ta);summary();schedule(key);
});
document.addEventListener("click",function(e){
  var b=e.target;if(!b.classList||!b.classList.contains("rv"))return;
  var ta=b.parentNode.parentNode.querySelector("textarea"),key=ta.getAttribute("data-key");
  ta.value=F[key].base;delete over[key];size(ta);meta(ta);preview(ta);summary();save(key);
});
document.addEventListener("focusout",function(e){
  var ta=e.target;if(!ta.matches||!ta.matches("textarea[data-key]"))return;
  var key=ta.getAttribute("data-key");if(timers[key]){clearTimeout(timers[key]);save(key);}
});

function exportText(){
  var L=["# 샘플 결과지 수정본 (QVHD)",""];
  D.cells.forEach(function(c){
    L.push("## "+c.no+". "+c.cell);
    ["C","N"].forEach(function(k){
      var v=c[k];
      if(typeof v==="object"){L.push("- "+k+": "+cur("c"+c.no+"_"+k+"_name")+" / "+cur("c"+c.no+"_"+k+"_line"));if(v.empathy!==undefined)L.push("  - 공감 한 줄: "+cur("c"+c.no+"_"+k+"_empathy"));}
      else{L.push("- "+k+": "+cur("c"+c.no+"_"+k));if(c.story)L.push("  - 에피소드: "+cur("c"+c.no+"_"+k+"_story"));}
    });
    L.push("");
  });
  L.push("## 경계 문구");
  ["Q","V","H","D","C","N"].forEach(function(k){L.push("- "+k+": "+cur("b_"+k));});
  return L.join("\n");
}
$("copyAll").addEventListener("click",function(){
  var t=exportText();
  function fallback(){$("exportBox").hidden=false;var ta=$("exportTa");ta.value=t;ta.focus();ta.select();}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){status("수정본을 복사했어요");},fallback);}
  else fallback();
});

(async function(){
  var t=setTimeout(function(){status("공유 저장소에 아직 연결하지 못했어요. 이 기기에만 저장돼요");},10000);
  try{
    var u=await claude.use("user");
    if(u&&typeof u.can==="function"){var cw=u.can("data.write");if(cw===false)canWrite=false;}
    db=await claude.use("db");
  }catch(e){db=null;}
  if(!db){clearTimeout(t);status("공유 저장소 없음. 이 기기에만 저장돼요");return;}
  over={};render();
  db.collection("edits").onSnapshot(function(snap){
    clearTimeout(t);
    snap.docChanges().forEach(function(ch){
      var k=ch.doc.id,d=ch.doc.data();
      if(ch.type==="removed")delete over[k];else if(d&&typeof d.v==="string")over[k]=d.v;
      var ta=document.querySelector("textarea[data-key=\""+k+"\"]");
      if(ta&&document.activeElement!==ta&&!timers[k]){ta.value=cur(k);size(ta);meta(ta);preview(ta);}
    });
    if(!snap.metadata.fromCache)status(canWrite?"자동 저장 켜짐":"읽기 전용(쓰기 권한 없음)");
    summary();
  },function(e){clearTimeout(t);status("저장소 오류("+(e&&e.code||"알 수 없음")+"). 이 기기에만 저장돼요");});
})();
