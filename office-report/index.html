<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>삼킨 말 오피스 리포트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 결재 서류 한 장. 장면 6개를 고르면 결과 카드(삼킨 말 개수 + 내 유형 + 상사 궁합 도장)가 나온다. */
:root{
  --paper:#F6F7F9; --sheet:#FFFFFF; --ink:#1E2740; --muted:#5C657C; --line:#D9DDE6;
  --stamp:#D23A2E; --marker:#FFE14D; --soft:#EEF1F6; --ok:#1D6B45; --ok-soft:#E3F1E8; --bad-soft:#FBE5E2;
  --display:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121725; --sheet:#1B2234; --ink:#E9ECF3; --muted:#A0A8BC; --line:#2E3750;
  --stamp:#F0675B; --marker:#F5D63D; --soft:#232B40; --ok:#6FD39A; --ok-soft:#1F3A2D; --bad-soft:#40222A; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121725; --sheet:#1B2234; --ink:#E9ECF3; --muted:#A0A8BC; --line:#2E3750;
  --stamp:#F0675B; --marker:#F5D63D; --soft:#232B40; --ok:#6FD39A; --ok-soft:#1F3A2D; --bad-soft:#40222A; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65;word-break:keep-all;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px;-webkit-tap-highlight-color:transparent}
.wrap{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--stamp);outline-offset:2px}
.mark{background:linear-gradient(transparent 55%,var(--marker) 55%);color:inherit;padding:0 2px}
.label{font-size:13px;font-weight:700;color:var(--muted)}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:22px 20px}
.btn{display:block;width:100%;min-height:52px;border:0;border-radius:6px;padding:14px 16px;font-size:17px;font-weight:700;background:var(--ink);color:var(--sheet);text-align:center}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.stamp{background:var(--stamp);color:#fff}
.fine{font-size:13px;color:var(--muted);text-align:center}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* 인트로 */
.doc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.docno{font-family:var(--mono);font-size:13px;color:var(--muted);line-height:1.5}
.approval{display:grid;grid-template-columns:repeat(3,48px);border:1px solid var(--ink);flex-shrink:0}
.approval div{border-left:1px solid var(--ink);text-align:center;font-size:13px}
.approval div:first-child{border-left:0}
.approval span{display:block;border-bottom:1px solid var(--ink);padding:2px 0;background:var(--soft)}
.approval i{display:grid;place-items:center;height:38px;font-style:normal}
.seal{width:30px;height:30px;border:2px solid var(--stamp);border-radius:50%;color:var(--stamp);font-family:var(--display);font-size:13px;display:grid;place-items:center;transform:rotate(-12deg)}
.hero-title{font-size:36px;line-height:1.2;margin-top:18px}
.hero-sub{color:var(--muted);margin-top:10px}
.cast{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:20px}
.cast figure{margin:0;text-align:center;font-size:13px;line-height:1.4;color:var(--muted)}
.cast figcaption b{display:block;color:var(--ink);font-size:15px}
.cast svg{width:100%;max-width:72px;height:auto;display:block;margin:0 auto 4px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px}
.step{background:var(--soft);border-radius:6px;padding:10px 8px;text-align:center;font-size:14px;line-height:1.4}
.step b{display:block;font-family:var(--mono);font-size:13px;color:var(--muted)}
.meta-row{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-top:16px}

/* 상사 고르기 */
.back{background:none;border:0;min-height:44px;padding:0;color:var(--muted);font-size:14px;align-self:flex-start}
.pick-title{font-size:28px;line-height:1.3}
.bosses{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bz{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;background:var(--sheet);border:2px solid var(--line);border-radius:6px;padding:14px 10px;min-height:44px}
.bz svg{width:64px;height:auto}
.bz b{font-size:16px}
.bz .tip{font-size:14px;color:var(--muted);line-height:1.45}
.bz[aria-pressed=true]{border-color:var(--ink);background:var(--soft)}

/* 장면 */
.prog{display:flex;flex-direction:column;gap:8px}
.prog-top{display:flex;justify-content:space-between;font-family:var(--mono);font-size:14px;color:var(--muted)}
.prog-top b{color:var(--ink)}
.segs{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.segs i{height:6px;border-radius:3px;background:var(--soft)}
.segs i.on{background:var(--ink)}
.segs i.now{background:var(--stamp)}
.timer{position:relative;height:30px;margin-top:2px}
.timer .trk{position:absolute;left:0;right:0;top:12px;height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.timer .trk i{display:block;height:100%;background:var(--stamp);width:100%}
.timer .who{position:absolute;top:0;width:30px;height:30px;margin-left:-15px}
.timer .who svg{width:30px;height:30px;display:block}
.when{font-family:var(--mono);font-size:14px;color:var(--stamp);font-weight:600}
.sit{font-size:22px;line-height:1.4;margin-top:6px}
.said{display:flex;gap:12px;align-items:flex-start;margin-top:16px;padding:12px;background:var(--soft);border-radius:6px}
.said svg{width:48px;height:48px;flex-shrink:0}
.said span{display:block;font-size:13px;font-weight:700;color:var(--muted)}
.choices{display:flex;flex-direction:column;gap:10px}
.ch{display:block;width:100%;text-align:left;background:var(--sheet);border:2px solid var(--line);border-radius:6px;padding:14px 16px;min-height:64px}
.ch b{display:block;font-size:13px;color:var(--muted);margin-bottom:2px}
.ch span{font-size:16px;line-height:1.5}
.ch:active{background:var(--soft)}
.ch.sel{border-color:var(--ink);background:var(--soft)}
.ch.dim{opacity:.55}
.inner{padding:14px 16px;border:1px dashed var(--stamp);border-radius:6px;background:var(--bad-soft)}
.inner.none{background:var(--ok-soft);border-color:var(--ok)}
.inner .label{color:var(--stamp)}
.inner.none .label{color:var(--ok)}
.inner p{margin-top:2px;font-size:16px}

/* 로딩 */
.loading{text-align:center;padding:60px 0}
.loading .seal{width:72px;height:72px;font-size:22px;margin:0 auto 18px;animation:thump .9s ease-in-out infinite}
@keyframes thump{0%,100%{transform:rotate(-12deg) scale(1)}50%{transform:rotate(-12deg) scale(.86)}}

/* 결과 */
.summary{text-align:center;display:flex;flex-direction:column;gap:4px}
.summary p{color:var(--muted);font-size:15px}
.big{font-family:var(--display);font-size:96px;line-height:1;color:var(--stamp);font-variant-numeric:tabular-nums}
.big small{font-size:32px;color:var(--ink);margin-left:4px}
.summary h1{font-size:26px;line-height:1.3}
.res-top{display:flex;gap:14px;align-items:center}
.res-top svg{width:92px;height:auto;flex-shrink:0}
.res-type{font-size:14px;font-weight:700;color:var(--stamp)}
.res-name{font-size:30px;line-height:1.15;margin-top:2px}
.res-line{margin-top:6px;font-size:16px}
.why{margin-top:14px;font-size:14px;background:var(--soft);border-radius:6px;padding:10px 12px}
.desc{margin-top:14px;font-size:16px}
.tipbox{margin-top:14px;padding-top:12px;border-top:2px solid var(--ink);display:flex;flex-direction:column;gap:2px}
.tipbox span:last-child{color:var(--stamp);font-weight:700}
.match{position:relative}
.duo{display:flex;align-items:center;gap:6px;margin-top:8px}
.duo svg{width:52px;height:auto}
.duo em{font-style:normal;font-family:var(--display);font-size:20px;color:var(--stamp)}
.duo .nm{font-size:15px;margin-left:6px;line-height:1.4}
.verdict{margin-top:14px;font-size:16px}
.big-stamp{position:absolute;right:12px;top:14px;border:3px solid var(--stamp);color:var(--stamp);font-family:var(--display);font-size:24px;padding:4px 12px;border-radius:6px;transform:rotate(8deg);background:var(--sheet)}
.recap{display:flex;flex-direction:column}
.rc{padding:10px 0;border-bottom:1px dashed var(--line);font-size:15px}
.rc:last-child{border-bottom:0}
.rc b{font-weight:700}
.rc .tg{float:right;font-size:13px;font-weight:700;padding:1px 8px;border-radius:10px;background:var(--bad-soft);color:var(--stamp)}
.rc .tg.ok{background:var(--ok-soft);color:var(--ok)}
.rc p{clear:both;font-size:14px;color:var(--muted);margin-top:2px}
.try{margin-top:10px;font-size:18px;font-weight:700;padding:14px 16px;background:var(--soft);border-radius:6px;line-height:1.55}
.locked ol{margin:12px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:16px}
.locked .blur{filter:blur(5px);user-select:none;color:var(--muted);margin-top:12px;font-size:14px}
.price{display:flex;align-items:baseline;gap:8px;margin-top:16px}
.price b{font-family:var(--mono);font-size:26px}
.fake{margin-top:14px;padding:16px;border:1px dashed var(--stamp);border-radius:6px;display:flex;flex-direction:column;gap:10px}
.fake input{width:100%;min-height:48px;font:inherit;padding:12px;border:1px solid var(--line);border-radius:6px;background:var(--sheet);color:var(--ink)}
.fake input:focus-visible{outline:3px solid var(--stamp);outline-offset:2px}
.card-pop{position:fixed;inset:0;background:rgba(10,14,26,.7);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}
.card-box{background:var(--sheet);border-radius:8px;padding:14px;max-width:420px;width:100%;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:10px}
.card-box img{width:100%;height:auto;border-radius:6px;display:block;-webkit-touch-callout:default;user-select:auto}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--sheet);padding:10px 16px;border-radius:6px;font-size:14px;z-index:40;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.q{margin:16px 0}.q .qt{font-weight:700;margin:0 0 8px}.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{min-height:44px;padding:8px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--sheet);color:var(--ink);font:inherit;font-size:15px;cursor:pointer;text-align:left}
.opt[aria-pressed="true"]{border-color:var(--stamp);background:var(--bad-soft);font-weight:700}
.rp{margin:14px 0}.rp h4{margin:0 0 4px;font-size:17px}.rp p{margin:0}
.rp .blur{filter:blur(5px);user-select:none;margin-top:4px}
.review{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--muted);margin-top:12px}
</style>

<div class="wrap" id="app"></div>
<div class="toast" id="toast" hidden></div>
<div class="card-pop" id="pop" hidden>
  <div class="card-box" role="dialog" aria-label="결과 카드 이미지">
    <img id="popImg" alt="올해 내가 삼킨 말 결과 카드">
    <p class="fine" id="popHint">이미지를 길게 누르면 저장할 수 있어요.</p>
    <button class="btn ghost" id="popX">닫기</button>
  </div>
</div>

<script>
// 사람 캐릭터 공통: 어깨, 목, 얼굴, 귀
const SKIN='#F3C9A5', SKIN2='#E5B08A';
const BODY=(c)=>`<path d="M16 122 Q18 90 60 87 Q102 90 104 122 Z" fill="${c}"/><rect x="52" y="72" width="16" height="17" fill="${SKIN2}"/><circle cx="36" cy="56" r="5" fill="${SKIN2}"/><circle cx="84" cy="56" r="5" fill="${SKIN2}"/><circle cx="60" cy="54" r="24" fill="${SKIN}"/>`;
const CHAR = {
  // 나: 평범한 직원, 후드티
  ME:`<svg viewBox="0 0 120 120" aria-hidden="true">${BODY('#8C96AD')}<path d="M44 88 Q60 100 76 88" stroke="#6F7890" stroke-width="4" fill="none"/><path d="M35 52 Q34 28 60 27 Q86 28 85 52 Q78 40 60 40 Q42 40 35 52 Z" fill="#3A3F4E"/><circle cx="50" cy="56" r="3" fill="#1E2740"/><circle cx="70" cy="56" r="3" fill="#1E2740"/><path d="M55 67 q5 3 10 0" stroke="#1E2740" stroke-width="3" fill="none" stroke-linecap="round"/></svg>`,
  // 아직이야 부장: 단정한 가르마, 안경, 넥타이, 치켜뜬 눈썹
  TB:`<svg viewBox="0 0 120 120" aria-hidden="true">${BODY('#33427A')}<path d="M50 88 L60 106 L70 88 Z" fill="#fff"/><path d="M57.5 91 h5 l2 15 -4.5 5 -4.5 -5 z" fill="#D23A2E"/><path d="M35 52 Q34 27 60 26 Q86 26 85 52 Q82 38 66 36 Q50 37 38 47 Z" fill="#262B38"/><rect x="43" y="50" width="14" height="10" rx="3" fill="none" stroke="#1E2740" stroke-width="2.5"/><rect x="63" y="50" width="14" height="10" rx="3" fill="none" stroke="#1E2740" stroke-width="2.5"/><path d="M57 54 h6" stroke="#1E2740" stroke-width="2.5"/><circle cx="50" cy="55" r="2.2" fill="#1E2740"/><circle cx="70" cy="55" r="2.2" fill="#1E2740"/><path d="M43 45 l12 3 M77 45 l-12 3" stroke="#262B38" stroke-width="3" stroke-linecap="round"/><path d="M54 68 h12" stroke="#1E2740" stroke-width="3" stroke-linecap="round"/><path d="M92 22 l5 -8 M100 30 l9 -4" stroke="#D23A2E" stroke-width="3" stroke-linecap="round"/></svg>`,
  // 알아서 해 팀장: 부스스한 머리, 반쯤 감은 눈, 가디건, 머그컵
  TG:`<svg viewBox="0 0 120 120" aria-hidden="true">${BODY('#B98B5E')}<path d="M52 88 L60 100 L68 88 Z" fill="#EDE6DA"/><path d="M35 54 Q32 28 58 26 Q86 23 86 52 Q80 40 71 43 Q63 33 54 41 Q44 37 35 54 Z" fill="#6B4A35"/><path d="M45 56 q5 3 10 0 M65 56 q5 3 10 0" stroke="#1E2740" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M45 50 h9 M66 50 h9" stroke="#6B4A35" stroke-width="2.5" stroke-linecap="round"/><path d="M54 67 q6 4 12 0" stroke="#1E2740" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="82" y="92" width="18" height="20" rx="3" fill="#F2B544"/><path d="M100 97 h3 a5 5 0 0 1 0 10 h-3" stroke="#D9962C" stroke-width="3" fill="none"/><path d="M88 86 q-3 -4 0 -8 M94 86 q-3 -4 0 -8" stroke="#9BA3B8" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>`,
  // 일단 해보자 과장: 삐죽 머리, 크게 벌린 입, 걷은 소매, 번쩍 든 주먹
  MB:`<svg viewBox="0 0 120 120" aria-hidden="true">${BODY('#F4C430')}<path d="M52 88 L60 98 L68 88 Z" fill="#fff"/><path d="M96 120 L100 90" stroke="${SKIN2}" stroke-width="10" stroke-linecap="round"/><circle cx="100" cy="84" r="9" fill="${SKIN}"/><path d="M36 48 L38 30 L46 38 L52 24 L59 36 L66 23 L72 36 L80 28 L84 48 Q72 38 60 38 Q46 38 36 48 Z" fill="#1F2430"/><circle cx="50" cy="55" r="3.2" fill="#1E2740"/><circle cx="70" cy="55" r="3.2" fill="#1E2740"/><path d="M44 47 q6 -4 11 -1 M65 46 q5 -3 11 1" stroke="#1F2430" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M50 63 q10 13 20 0 Z" fill="#7A2E2E"/><path d="M85 40 q4 6 0 9 q-4 -3 0 -9 Z" fill="#7FC3F0"/><path d="M14 70 l8 2 M16 80 l8 -1" stroke="#D23A2E" stroke-width="3" stroke-linecap="round"/></svg>`,
  // 허허 차장: 숱 적은 머리, 웃는 눈, 볼터치, 니트 조끼
  MG:`<svg viewBox="0 0 120 120" aria-hidden="true">${BODY('#4E9A67')}<path d="M50 88 L60 100 L70 88 Z" fill="#E8F0E4"/><path d="M36 56 Q35 44 40 40 L42 54 Z M84 56 Q85 44 80 40 L78 54 Z" fill="#8C8C8C"/><path d="M56 31 q2 -6 6 -7 M62 31 q3 -5 7 -5" stroke="#8C8C8C" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M45 55 q5 -5 10 0 M65 55 q5 -5 10 0" stroke="#1E2740" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="44" cy="63" r="4" fill="#F29B8E" opacity=".7"/><circle cx="76" cy="63" r="4" fill="#F29B8E" opacity=".7"/><path d="M50 64 q10 10 20 0" stroke="#1E2740" stroke-width="3" fill="none" stroke-linecap="round"/></svg>`
};



// 상사 4유형 (캐릭터 = 상사 성향)
const BOSS = {
  TB:{name:'아직이야 부장',tip:'“아직이야?” 하고 진행 상황을 자주 묻는 상사'},
  TG:{name:'알아서 해 팀장',tip:'“알아서 해 줘” 하고 일을 맡겨 두는 상사'},
  MB:{name:'일단 해보자 과장',tip:'일단 시작부터 하자고 밀어붙이는 열정 상사'},
  MG:{name:'허허 차장',tip:'허허 웃으며 넘기는 평화로운 상사'}
};
const meOf=(c,n)=>CHAR.ME.replace('#8C96AD',c);
// 내 유형 4종 (삼킨 정도 × 돌려 말하는 정도). 캐릭터 그림은 같은 사무용품을 쓴다.
const ME = {
  CK:{name:'그 자리에서 말하는 사람',svg:meOf('#E0644F'),line:'할 말은 그 자리에서 한다',
      desc:'참는 것보다 말하는 쪽을 고르는 사람. 하고 싶은 말을 바로 꺼내서 일이 쌓이지 않아요. 다만 말이 짧아서 상대가 가끔 놀랄 수 있어요.',
      tip:'결론 앞에 한 문장만 더 붙여 보세요.'},
  BI:{name:'돌려서 말하는 사람',svg:meOf('#F2C94C'),line:'시간과 대안을 붙여서 말한다',
      desc:'부딪히지 않고 돌려서 전하는 사람. 시간이나 대안을 먼저 꺼내 상대가 받아들이기 쉽게 말해요. 대신 정말 중요한 말이 돌리다가 흐려질 수 있어요.',
      tip:'가장 중요한 한 가지는 돌리지 말고 그대로 말해 보세요.'},
  NG:{name:'삼키고 식히는 사람',svg:meOf('#C9A27A'),line:'삼키고, 식은 뒤에 한마디',
      desc:'대부분 참지만 꼭 필요한 순간에는 부드럽게 한마디를 꺼내는 사람. 속에는 많이 쌓이는데 겉은 평화로워요. 쌓인 말이 한꺼번에 터지지 않게 가끔 풀어 주세요.',

      <h3 style="font-size:22px;margin-top:6px">내 상황을 알려 주면 맞춤 풀이를 써 드려요.</h3>
      <p class="desc" style="margin-top:6px">여섯 가지만 고르면 돼요. 약 30초 걸리고, 고른 내용은 이 기기 밖으로 나가지 않아요.</p>
      ${QS.map(q=>`<div class="q"><p class="qt">${q.t}</p><div class="opts" data-q="${q.k}">${q.o.map(o=>`<button class="opt" data-v="${o[0]}" aria-pressed="${CTX[q.k]==o[0]}">${o[1]}</button>`).join('')}</div></div>`).join('')}

  }
  const B=BOSS[bossId].name, topS=SHORT[R.top], sw=R.swallowed>0;
  const eun=n=>{const k=n.charCodeAt(n.length-1)-0xAC00;return n+(k>=0&&k%28!==0?'은':'는')};
  const c={B,Bn:eun(B),lead:sw?`오늘 가장 말을 삼킨 장면은 ‘${topS}’ 장면이에요. `:'오늘은 삼킨 말이 없었어요. '};
  const free=[['내가 일하는 자리',BL.w[CTX.w](c)],['요즘 가장 힘든 순간',BL.h[CTX.h](c)]];
  const paid=[[`${B}에게 맞는 말하는 방법`,BL.l[CTX.l](c)],['내 피드백 환경에서 지켜야 할 것',BL.f[CTX.f](c)],['내 연차에 맞는 조언',BL.y[CTX.y](c)],['내 팀 규모에 맞는 조언',BL.t[CTX.t](c)]];
  const lockedHtml=paid.map(([h,x])=>{const [a,b]=firstSent(x);return `<div class="rp"><h4>${h}</h4><p>${a}</p>${b?(FULL?`<p>${b}</p>`:`<p class="blur" aria-hidden="true">${b}</p>`):''}</div>`}).join('');
  return `<section class="sheet"><p class="label">내 맞춤 풀이 · 무료 맛보기</p>

    ${lockedHtml}
    ${FULL?'<p class="review">팀 검토용 보기예요. 실제 공개판에서는 첫 문장만 보이고 나머지는 가려져요.</p>':''}
    <button class="btn ghost" id="repEdit" style="margin-top:8px">내 상황 다시 고르기</button></section>`;
}
function bindRep(){
  const box=$('rep'); if(!box) return;
  box.onclick=e=>{
    const o=e.target.closest('.opt');
    if(o){const k=o.parentNode.dataset.q; CTX[k]=o.dataset.v; box.querySelectorAll(`[data-q="${k}"] .opt`).forEach(x=>x.setAttribute('aria-pressed',x===o)); return}
    if(e.target.id==='repGo'){ if(!CTX_OK(CTX)){toast('여섯 가지를 모두 골라 주세요');return} store.set('ctx',CTX); box.innerHTML=repInner(); box.scrollIntoView({block:'start',behavior:'smooth'}); return }
    if(e.target.id==='repEdit'){ CTX={}; store.set('ctx',CTX); box.innerHTML=repInner(); }
  };
}

/* 5. 결과 카드 이미지 */
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function svgImg(svg,px){return new Promise(res=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>res(null);
  i.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg.replace('<svg ',`<svg xmlns="http://www.w3.org/2000/svg" width="${px}" height="${px}" `))})}
async function drawCard(r){
  const T=ME[r.me], B=BOSS[r.boss];
  const glyphs='올해 내가 삼킨 말 개 2026 연말 결산 삼킨 말 상사 궁합 나 상사 × 올해도 무사히, 결재 승인 0123456789 내 유형 '+Object.values(ME).map(t=>t.name+t.line).join('')+Object.values(BOSS).map(b=>b.name).join('')+'천생연분 결재 승인 보류 반려 캐릭터 · “”';
  try{await Promise.all([document.fonts.load("80px 'Do Hyeon'",glyphs),document.fonts.load("400 30px 'IBM Plex Sans KR'",glyphs),document.fonts.load("700 30px 'IBM Plex Sans KR'",glyphs)])}catch(e){}
  const W=1080,H=1350,cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');
  const D="'Do Hyeon','IBM Plex Sans KR',sans-serif",U="'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif";
  x.fillStyle='#F6F7F9';x.fillRect(0,0,W,H);
  x.fillStyle='#1E2740';x.fillRect(0,0,W,150);
  x.fillStyle='#fff';x.textAlign='left';x.font=`68px ${D}`;x.fillText('2026 삼킨 말 결산',70,100);
  x.font=`400 30px ${U}`;x.globalAlpha=.8;x.textAlign='right';const d=new Date();x.fillText(`${d.getMonth()+1}월 ${d.getDate()}일`,W-70,98);x.globalAlpha=1;
  // 삼킨 말 개수
  x.fillStyle='#fff';x.strokeStyle='#D9DDE6';x.lineWidth=3;rr(x,60,190,W-120,300,26);x.fill();x.stroke();
  x.textAlign='left';x.fillStyle='#626B82';x.font=`700 34px ${U}`;x.fillText('올해 내가 삼킨 말',100,255);
  x.fillStyle='#D23A2E';x.font=`220px ${D}`;x.fillText(String(r.swallowed),94,455);
  const nw=x.measureText(String(r.swallowed)).width;x.fillStyle='#1E2740';x.font=`80px ${D}`;x.fillText('개',112+nw,455);
  const me=await svgImg(T.svg,240); if(me) x.drawImage(me,W-340,230,240,240);
  // 내 유형
  x.fillStyle='#fff';rr(x,60,520,W-120,250,26);x.fill();x.stroke();
  x.fillStyle='#D23A2E';x.font=`700 34px ${U}`;x.fillText('내 유형',100,590);
  x.fillStyle='#1E2740';x.font=`84px ${D}`;x.fillText(T.name,100,680);
  x.fillStyle='#626B82';x.font=`400 36px ${U}`;x.fillText(`“${T.line}”`,102,735);
  // 궁합
  x.fillStyle='#fff';rr(x,60,800,W-120,330,26);x.fill();x.stroke();
  x.fillStyle='#626B82';x.font=`700 32px ${U}`;x.fillText('상사 궁합',100,860);
  const a=await svgImg(T.svg,170),b=await svgImg(CHAR[r.boss],170);
  if(a)x.drawImage(a,100,890,170,170);
  x.fillStyle='#D23A2E';x.font=`70px ${D}`;x.fillText('×',290,1000);
  if(b)x.drawImage(b,370,890,170,170);
  x.fillStyle='#1E2740';x.font=`700 32px ${U}`;x.fillText(`나 × ${B.name}`,100,1105);
  x.save();x.translate(W-270,980);x.rotate(.15);x.strokeStyle='#D23A2E';x.fillStyle='#D23A2E';x.lineWidth=9;rr(x,-170,-70,340,140,16);x.stroke();
  x.textAlign='center';x.font=`92px ${D}`;x.fillText(r.stamp,0,32);x.restore();
  // 하단
  x.textAlign='left';x.fillStyle='#1E2740';x.font=`58px ${D}`;x.fillText('올해도 무사히, 결재 승인',60,1220);
  x.fillStyle='#626B82';x.font=`400 30px ${U}`;
  const q=r.top>=0&&r.n.c<6?`가장 삼킨 말: “${SCENES[r.top].inner}”`:'삼킨 말이 없는 한 해였어요.';
  const ls=q.length>26?[q.slice(0,26),q.slice(26)]:[q]; ls.forEach((l,n)=>x.fillText(l,62,1272+n*40));
  x.fillStyle='#D23A2E';x.textAlign='right';x.font=`44px ${D}`;x.fillText('삼킨 말 상사궁합',W-64,1190);
  return cv.toDataURL('image/png');
}
